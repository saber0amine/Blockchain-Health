version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    networks:
      - backend
    depends_on:
      - db

  db-backup:
    image: postgres:latest
    volumes:
      - db-backup-data:/var/lib/postgresql/data
      - ./backup:/backup
    entrypoint: >
      bash -c 'while true; do
      PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -U $$POSTGRES_USER -h db $$POSTGRES_DB > /backup/dump_$(date +%d-%m-%Y"_"%H_%M_%S).sql;
      sleep 86400;
      done'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend
    depends_on:
      - db

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend
    depends_on:
      - db

networks:
  backend:
    driver: bridge

volumes:
  db-data:
  db-backup-data:

